spring.application.name=payments-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n
