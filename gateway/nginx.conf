resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location / {
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
    }

    location /payments {
        set $payments http://payments-service:8080;
        proxy_pass $payments;
    }

    location /orders {
        set $orders http://orders-service:8080;
        proxy_pass $orders;
    }
}
