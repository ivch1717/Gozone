name: gozone

services:
  gateway:
    image: nginx:stable
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      payments-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    restart: unless-stopped

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: gozone
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-gozone-payments-local}
    ports:
      - "127.0.0.1:${PAYMENTS_DB_PORT:-15432}:5432"
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gozone -d payments"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: gozone
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-gozone-orders-local}
    ports:
      - "127.0.0.1:${ORDERS_DB_PORT:-25432}:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gozone -d orders"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-requests --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-results --partitions 1 --replication-factor 1
    restart: "no"

  payments-service:
    build:
      context: .
      args:
        SERVICE: payments-service
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-8081}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://payments-db:5432/payments
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: ${PAYMENTS_DB_PASSWORD:-gozone-payments-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_SHOW_SQL: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 768m
    depends_on:
      payments-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  orders-service:
    build:
      context: .
      args:
        SERVICE: orders-service
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8082}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/orders
      SPRING_DATASOURCE_USERNAME: gozone
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD:-gozone-orders-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_SHOW_SQL: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 768m
    depends_on:
      orders-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  payments-data:
  orders-data:
  kafka-data:
